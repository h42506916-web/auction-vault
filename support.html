<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/logo-mark.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css?v=20261006"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js?v=20261006"></script><script src="js/db.js?v=20261006"></script><script src="js/common.js?v=20261006"></script>
<title>Customer Service — Auction Vault</title></head>
<body data-page="support">
<header id="site-header"></header>
<main class="container">
  <div class="page-head">
    <h1>Customer Service</h1>
    <p>Our assistant will ask you a few quick questions and answer common queries straight away. For anything more involved, the owner is happy to help by phone.</p>
  </div>
  <section class="block">
    <div class="chat-wrap">
      <div class="chat-head"><img src="assets/logo-mark.png" alt=""><h3>Vault Assistant</h3><span class="progress" id="progress"></span></div>
      <div class="chat-log" id="log" aria-live="polite"></div>
      <div class="quick" id="quick"></div>
      <form class="chat-input" id="chat-form" autocomplete="off">
        <input id="chat-in" placeholder="Type your answer…" aria-label="Your answer">
        <button class="btn" type="submit">Send</button>
      </form>
    </div>
    <div class="call-card">Prefer to talk? Call the owner on <a href="tel:455982359">455982359</a> · <a href="#" id="restart">Restart chat</a></div>
  </section>
</main>
<footer id="site-footer"></footer>
<script src="js/support.js?v=20261006"></script>
</body></html>
